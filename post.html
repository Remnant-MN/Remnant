<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>공지사항</title>


  <style>

    :root {

      --bg: #08080d;

      --panel: #11111a;

      --text: #f4f1ff;

      --muted: #a7a2b8;

      --accent: #a78bfa;

      --accent2: #6d28d9;

      --line: rgba(167,139,250,.22);

    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.8;

    }


    /* =========================
       상단 메뉴
    ========================= */

    header {

      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);

    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;

    }


    .logo span {

      color: var(--accent);

    }


    /* 메인 화면 버튼 */

    .home-button {

      display: inline-block;

      padding: 10px 18px;

      border: 1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);

      transition: .2s;

      white-space: nowrap;

    }


    .home-button:hover {

      background: var(--accent2);

      transform: translateY(-2px);

    }


    /* =========================
       본문
    ========================= */

    main {

      max-width: 900px;

      margin: auto;

      padding: 50px 24px;

    }


    /* 게시글 */

    .post {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 20px;

      overflow: hidden;

    }


    /* 게시글 제목 영역 */

    .post-header {

      padding: 35px;

      border-bottom: 1px solid var(--line);

    }


    .post-title {

      font-size: 2.2rem;

      word-break: break-word;

    }


    /* 날짜 */

    .post-date {

      margin-top: 10px;

      color: var(--accent);

      font-size: .9rem;

    }


    /* 게시글 내용 */

    .post-content {

      padding: 35px;

      color: var(--muted);

      white-space: pre-line;

      word-break: break-word;

    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 760px) {


      nav {

        padding: 18px 20px;

      }


      .home-button {

        padding: 9px 14px;

        font-size: .9rem;

      }


      main {

        padding: 35px 20px;

      }


      .post-header {

        padding: 25px 20px;

      }


      .post-title {

        font-size: 1.7rem;

      }


      .post-content {

        padding: 25px 20px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       상단 메뉴
  ========================= -->

  <header>

    <nav>


      <div class="logo">

        <span>Remnant</span>

      </div>


      <!--  Remnant  -->

      <a

        href="index.html"

        class="home-button"

      >

       Remnant
      </a>


    </nav>

  </header>


  <!-- =========================
       본문
  ========================= -->

  <main>


    <article class="post">


      <!-- 게시글 제목 영역 -->

      <div class="post-header">


        <h1

          id="postTitle"

          class="post-title"

        >

          불러오는 중...

        </h1>


        <div

          id="postDate"

          class="post-date"

        >

        </div>


      </div>


      <!-- 게시글 내용 -->

      <div

        id="postContent"

        class="post-content"

      >

        게시글을 불러오는 중입니다...

      </div>


    </article>


  </main>


  <!-- =========================
       Supabase 연결
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    /* Supabase 설정 */

    const SUPABASE_URL =

      "https://isqkccngkadomhsackpf.supabase.co";


    const SUPABASE_KEY =

      "여기에_현재_사용중인_Supabase_Key";


    const supabaseClient =

      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

      );


    /* URL에서 게시글 ID 가져오기 */

    const params =

      new URLSearchParams(

        window.location.search

      );


    const postId =

      params.get("id");


    /* 게시글 불러오기 */

    async function loadPost() {


      /* 게시글 ID가 없는 경우 */

      if (!postId) {


        document.getElementById(

          "postTitle"

        ).textContent =

          "게시글을 찾을 수 없습니다.";


        document.getElementById(

          "postContent"

        ).textContent =

          "게시글 ID가 없습니다.";


        return;

      }


      /* Supabase에서 게시글 가져오기 */

      const {

        data,

        error

      } = await supabaseClient


        .from("posts")


        .select("*")


        .eq("id", postId)


        .single();


      /* 오류 또는 게시글 없음 */

      if (error || !data) {


        console.error(

          "게시글 불러오기 오류:",

          error

        );


        document.getElementById(

          "postTitle"

        ).textContent =

          "게시글을 찾을 수 없습니다.";


        document.getElementById(

          "postContent"

        ).textContent =

          "삭제되었거나 존재하지 않는 게시글입니다.";


        return;

      }


      /* 제목 표시 */

      document.getElementById(

        "postTitle"

      ).textContent =

        data.title;


      /* 내용 표시 */

      document.getElementById(

        "postContent"

      ).textContent =

        data.content;


      /* 날짜 표시 */

      if (data.created_at) {


        document.getElementById(

          "postDate"

        ).textContent =


          new Date(

            data.created_at

          ).toLocaleDateString(

            "ko-KR"

          );

      }


    }


    /* 게시글 불러오기 */

    loadPost();


  </script>


</body>

</html>
