<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>공지사항</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --line: rgba(167,139,250,.22);
    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    body {

      font-family:

        Arial,

        "Noto Sans KR",

        sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.8;

    }


    main {

      max-width: 900px;

      margin: auto;

      padding: 50px 24px;

    }


    .post {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 20px;

      overflow: hidden;

    }


    .post-header {

      padding: 35px;

      border-bottom: 1px solid var(--line);

    }


    .post-title {

      font-size: 2.2rem;

      word-break: break-word;

    }


    .post-date {

      margin-top: 10px;

      color: var(--accent);

      font-size: .9rem;

    }


    .post-content {

      padding: 35px;

      color: var(--muted);

      white-space: pre-line;

      word-break: break-word;

    }


    .back-button {

      display: inline-block;

      margin-top: 30px;

      padding: 12px 20px;

      border: 1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);

    }


    .back-button:hover {

      background: var(--accent);

    }


    .error {

      padding: 40px;

      text-align: center;

      color: #ff8a8a;

    }


    @media (max-width: 760px) {


      .post-title {

        font-size: 1.7rem;

      }


      .post-header {

        padding: 25px 20px;

      }


      .post-content {

        padding: 25px 20px;

      }

    }

  </style>

</head>


<body>


  <main>


    <article class="post">


      <div class="post-header">


        <h1

          id="postTitle"

          class="post-title"

        >

          게시글을 불러오는 중...

        </h1>


        <div

          id="postDate"

          class="post-date"

        ></div>


      </div>


      <div

        id="postContent"

        class="post-content"

      >

        게시글을 불러오는 중입니다...


      </div>


    </article>


    <a

      href="notice.html"

      class="back-button"

    >

      ← 공지사항으로 돌아가기

    </a>


  </main>


  <script>


    /*

      주소에서 게시글 ID 가져오기

      예시:

      post.html?id=123456

    */


    const params =

      new URLSearchParams(

        window.location.search

      );


    const postId =

      params.get("id");


    const postTitle =

      document.getElementById(

        "postTitle"

      );


    const postDate =

      document.getElementById(

        "postDate"

      );


    const postContent =

      document.getElementById(

        "postContent"

      );


    /*

      localStorage에서 게시글 가져오기

    */


    const savedPosts =

      JSON.parse(

        localStorage.getItem("posts")

      ) || [];


    /*

      ID가 같은 게시글 찾기

    */


    const post =

      savedPosts.find(

        function(item) {


          return String(item.id)

            === String(postId);


        }

      );


    /*

      게시글이 없을 경우

    */


    if (!post) {


      postTitle.textContent =

        "게시글을 찾을 수 없습니다.";


      postDate.textContent = "";


      postContent.innerHTML = `

        <div class="error">

          삭제되었거나 존재하지 않는 게시글입니다.

        </div>

      `;


    }


    /*

      게시글이 있을 경우

    */


    else {


      postTitle.textContent =

        post.title;


      postContent.textContent =

        post.content;


      postDate.textContent =

        post.date || "";

    }


  </script>


</body>

</html>
