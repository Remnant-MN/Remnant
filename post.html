<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>공지사항</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --line: rgba(167,139,250,.22);
    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.8;
    }


    main {

      max-width: 900px;

      margin: auto;

      padding: 50px 24px;
    }


    .post {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 20px;

      overflow: hidden;
    }


    .post-header {

      padding: 35px;

      border-bottom: 1px solid var(--line);
    }


    .post-title {

      font-size: 2.2rem;
    }


    .post-date {

      margin-top: 10px;

      color: var(--accent);

      font-size: .9rem;
    }


    .post-content {

      padding: 35px;

      color: var(--muted);

      white-space: pre-line;
    }


    .back-button {

      display: inline-block;

      margin-top: 30px;

      padding: 12px 20px;

      border: 1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);
    }


    .back-button:hover {

      background: var(--accent);
    }

  </style>

</head>


<body>


  <main>


    <article class="post">


      <div class="post-header">


        <h1
          id="postTitle"
          class="post-title"
        >

          불러오는 중...

        </h1>


        <div
          id="postDate"
          class="post-date"
        ></div>


      </div>


      <div
        id="postContent"
        class="post-content"
      >

        게시글을 불러오는 중입니다...

      </div>


    </article>


    <a
      href="notice.html"
      class="back-button"
    >

      ← 공지사항으로 돌아가기

    </a>


  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    const SUPABASE_URL =
      "https://isqkccngkadomhsackpf.supabase.co";


    const SUPABASE_KEY =
      "여기에_네_실제_KEY_입력";


    const supabaseClient =
      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

      );


    const params =
      new URLSearchParams(

        location.search

      );


    const postId =
      params.get("id");


    async function loadPost() {


      if (!postId) {


        document.getElementById(

          "postTitle"

        ).textContent =

          "게시글을 찾을 수 없습니다.";


        document.getElementById(

          "postContent"

        ).textContent =

          "주소에 게시글 ID가 없습니다.";


        return;

      }


      const {

        data,

        error

      } = await supabaseClient

        .from("posts")

        .select("*")

        .eq("id", postId)

        .single();


      if (error || !data) {


        console.error(error);


        document.getElementById(

          "postTitle"

        ).textContent =

          "게시글을 찾을 수 없습니다.";


        document.getElementById(

          "postContent"

        ).textContent =

          "삭제되었거나 존재하지 않는 게시글입니다.";


        return;

      }


      document.getElementById(

        "postTitle"

      ).textContent =

        data.title;


      document.getElementById(

        "postContent"

      ).textContent =

        data.content;


      document.getElementById(

        "postDate"

      ).textContent =


        new Date(

          data.created_at

        ).toLocaleDateString(

          "ko-KR"

        );

    }


    loadPost();


  </script>

</body>

</html>
