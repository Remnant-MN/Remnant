<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remnant 공지사항</title>


  <style>

    :root {

      --bg: #08080d;

      --panel: #11111a;

      --text: #f4f1ff;

      --muted: #a7a2b8;

      --accent: #a78bfa;

      --accent2: #6d28d9;

      --line: rgba(167, 139, 250, .22);

    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.8;

    }


    /* =========================
       상단 메뉴
    ========================= */

    header {

      background: rgba(8, 8, 13, .9);

      border-bottom: 1px solid var(--line);

    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;

    }


    .logo span {

      color: var(--accent);

    }


    nav a {

      color: var(--muted);

      text-decoration: none;

      transition: .2s;

    }


    nav a:hover {

      color: var(--text);

    }


    /* =========================
       본문
    ========================= */

    main {

      max-width: 900px;

      margin: auto;

      padding: 50px 24px;

    }


    /* 게시글 박스 */

    .post {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 20px;

      overflow: hidden;

    }


    /* 제목 영역 */

    .post-header {

      padding: 35px;

      border-bottom: 1px solid var(--line);

    }


    .post-title {

      font-size: 2.2rem;

      line-height: 1.4;

      margin-bottom: 10px;

    }


    .post-date {

      color: var(--accent);

      font-size: .9rem;

    }


    /* 게시글 내용 */

    .post-content {

      padding: 35px;

      color: var(--muted);

    }


    .post-content p {

      margin-bottom: 28px;

      white-space: pre-line;

    }


    /* =========================
       메인으로 돌아가기 버튼
    ========================= */

    .back-button {

      display: inline-block;

      margin-top: 30px;

      padding: 12px 20px;

      border: 1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);

      transition: .2s;

    }


    .back-button:hover {

      background: var(--accent2);

      transform: translateY(-2px);

    }


    /* =========================
       하단
    ========================= */

    footer {

      border-top: 1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);

      margin-top: 50px;

    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 760px) {


      main {

        padding: 30px 16px;

      }


      .post-header {

        padding: 25px 20px;

      }


      .post-title {

        font-size: 1.7rem;

      }


      .post-content {

        padding: 25px 20px;

      }


    }

  </style>

</head>


<body>


  <!-- =========================
       상단 메뉴
  ========================= -->

  <header>

    <nav>


      <div class="logo">

        <span>Remnant</span>

      </div>


      <a href="index.html">

        홈

      </a>


    </nav>

  </header>


  <!-- =========================
       본문
  ========================= -->

  <main>


    <article class="post">


      <!-- 제목 -->

      <div class="post-header">


        <h1 class="post-title">

          Remnant 공지사항

        </h1>


        <div class="post-date">

          2026

        </div>


      </div>


      <!-- 게시글 내용 -->

      <div class="post-content">


        <p>

Remnant 프로젝트에 오신 것을 환영합니다.

        </p>


        <p>

본 사이트는 가상의 세계관 Remnant를 기반으로 제작된 개인 프로젝트입니다.

        </p>


        <p>

세계관과 설정은 앞으로 지속적으로 업데이트될 예정입니다.

        </p>


        <p>

새로운 설정과 공지사항이 추가될 경우 이 페이지를 통해 안내됩니다.

        </p>


      </div>


    </article>


    <!-- 메인 홈페이지로 돌아가기 -->

    <a

      href="index.html"

      class="back-button"

    >

      ← 메인으로 돌아가기

    </a>


  </main>


  <!-- =========================
       하단
  ========================= -->

  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


</body>

</html>
