<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remnant 게시글</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #21133c 0,
          var(--bg) 35%
        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.8;
    }


    header {

      background:
        rgba(8,8,13,.9);

      border-bottom:
        1px solid var(--line);
    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;
    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;
    }


    .logo span {

      color: var(--accent);
    }


    nav a {

      color: var(--muted);

      text-decoration: none;
    }


    main {

      max-width: 900px;

      margin: auto;

      padding: 40px 24px;
    }


    .post {

      background: var(--panel);

      border:
        1px solid var(--line);

      border-radius: 20px;

      overflow: hidden;
    }


    .post-header {

      padding:
        35px 35px 20px;

      border-bottom:
        1px solid var(--line);
    }


    .post-title {

      font-size: 2.2rem;

      margin-bottom: 10px;
    }


    .post-date {

      color: var(--accent);

      font-size: .9rem;
    }


    .post-content {

      padding: 35px;

      color: var(--muted);

      white-space: pre-line;
    }


    .back-button {

      display: inline-block;

      margin-top: 30px;

      padding: 12px 20px;

      border:
        1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);
    }


    .back-button:hover {

      background: var(--accent2);
    }


    footer {

      border-top:
        1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);
    }


    @media (max-width: 760px) {

      .post-title {

        font-size: 1.7rem;
      }


      .post-header,
      .post-content {

        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <header>

    <nav>

      <div class="logo">

        <span>Remnant</span>

      </div>


      <a href="notice.html">

        공지사항

      </a>

    </nav>

  </header>


  <main>


    <article class="post">


      <div class="post-header">


        <h1
          id="postTitle"
          class="post-title"
        >

          게시글을 불러오는 중...

        </h1>


        <div
          id="postDate"
          class="post-date"
        >

        </div>

      </div>


      <div
        id="postContent"
        class="post-content"
      >

        게시글을 불러오는 중...

      </div>


    </article>


    <a
      href="notice.html"
      class="back-button"
    >

      ← 공지사항 목록으로 돌아가기

    </a>


  </main>


  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>


    const SUPABASE_URL =
      "YOUR_SUPABASE_URL";


    const SUPABASE_ANON_KEY =
      "YOUR_SUPABASE_ANON_KEY";


    const supabaseClient =
      supabase.createClient(

        SUPABASE_URL,

        SUPABASE_ANON_KEY

      );


    const params =
      new URLSearchParams(

        window.location.search

      );


    const postId =
      params.get("id");


    async function loadPost() {


      if (!postId) {

        document.getElementById(
          "postTitle"
        ).textContent =
          "게시글을 찾을 수 없습니다.";

        return;

      }


      const {

        data: post,

        error

      } = await supabaseClient

        .from("posts")

        .select("*")

        .eq("id", postId)

        .single();


      if (error) {


        console.error(error);


        document.getElementById(
          "postTitle"
        ).textContent =
          "게시글을 불러오지 못했습니다.";

        document.getElementById(
          "postContent"
        ).textContent =
          "게시글이 존재하지 않거나 삭제되었습니다.";

        return;

      }


      document.getElementById(
        "postTitle"
      ).textContent =
        post.title;


      document.getElementById(
        "postContent"
      ).textContent =
        post.content;


      if (post.created_at) {


        document.getElementById(
          "postDate"
        ).textContent =

          new Date(
            post.created_at
          ).toLocaleString(
            "ko-KR"
          );

      }

    }


    loadPost();


  </script>


</body>

</html>
