<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>공지사항</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #21133c 0,
          var(--bg) 35%
        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.8;
    }


    /* 본문 */

    main {

      max-width: 900px;

      margin: auto;

      padding: 50px 24px;
    }


    /* 게시글 박스 */

    .post {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 20px;

      overflow: hidden;
    }


    /* 제목 영역 */

    .post-header {

      padding: 35px;

      border-bottom: 1px solid var(--line);
    }


    .post-title {

      font-size: 2.2rem;

      line-height: 1.3;
    }


    /* 날짜 */

    .post-date {

      margin-top: 10px;

      color: var(--accent);

      font-size: .9rem;
    }


    /* 게시글 내용 */

    .post-content {

      padding: 35px;

      color: var(--muted);

      white-space: pre-line;

      word-break: break-word;
    }


    /* 돌아가기 버튼 */

    .back-button {

      display: inline-block;

      margin-top: 30px;

      padding: 12px 20px;

      border: 1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);

      transition: .2s;
    }


    .back-button:hover {

      background: var(--accent2);

      transform: translateY(-2px);
    }


    /* 모바일 */

    @media (max-width: 760px) {

      main {

        padding: 30px 15px;
      }


      .post-header {

        padding: 25px 20px;
      }


      .post-title {

        font-size: 1.7rem;
      }


      .post-content {

        padding: 25px 20px;
      }

    }

  </style>

</head>


<body>


  <main>


    <!-- 게시글 -->

    <article class="post">


      <!-- 제목과 날짜 -->

      <div class="post-header">


        <h1
          id="postTitle"
          class="post-title"
        >

          불러오는 중...

        </h1>


        <div
          id="postDate"
          class="post-date"
        >

        </div>


      </div>


      <!-- 본문 -->

      <div
        id="postContent"
        class="post-content"
      >

        게시글을 불러오는 중입니다...

      </div>


    </article>


    <!-- 공지사항 목록으로 돌아가기 -->

    <a
      href="notice.html"
      class="back-button"
    >

      ← 공지사항으로 돌아가기

    </a>


  </main>


  <!-- Supabase 라이브러리 -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    /*
      Supabase 연결 정보
    */


    const SUPABASE_URL =

      "https://isqkccngkadomhsackpf.supabase.co";


    const SUPABASE_KEY =

      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzcWtjY25na2Fkb21oc2Fja3BmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDgxNDksImV4cCI6MjEwMDYyNDE0OX0.zaEy5uaZ3vd4IULk8byqC5ASjvNZ_0mH3jpynrmzzyM";


    const supabaseClient =

      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

      );


    /*
      URL에서 게시글 ID 가져오기

      예시:

      post.html?id=게시글ID

    */


    const params =

      new URLSearchParams(

        window.location.search

      );


    const postId =

      params.get("id");


    /*
      게시글 불러오기

    */


    async function loadPost() {


      /* ID가 없을 경우 */

      if (!postId) {


        document.getElementById(

          "postTitle"

        ).textContent =

          "게시글을 찾을 수 없습니다.";


        document.getElementById(

          "postContent"

        ).textContent =

          "게시글 ID가 없습니다.";


        return;

      }


      /*
        Supabase에서 게시글 검색
      */


      const {

        data,

        error

      } = await supabaseClient


        .from("posts")


        .select("*")


        .eq("id", postId)


        .single();


      /*
        오류 처리
      */


      if (error || !data) {


        console.error(error);


        document.getElementById(

          "postTitle"

        ).textContent =

          "게시글을 찾을 수 없습니다.";


        document.getElementById(

          "postContent"

        ).textContent =

          "삭제되었거나 존재하지 않는 게시글입니다.";


        return;

      }


      /*
        제목 표시
      */


      document.getElementById(

        "postTitle"

      ).textContent =

        data.title;


      /*
        본문 표시
      */


      document.getElementById(

        "postContent"

      ).textContent =

        data.content;


      /*
        작성일 표시
      */


      if (data.created_at) {


        document.getElementById(

          "postDate"

        ).textContent =


          new Date(

            data.created_at

          ).toLocaleDateString(

            "ko-KR",

            {

              year: "numeric",

              month: "long",

              day: "numeric"

            }

          );

      }


    }


    /*
      페이지가 열리면 게시글 불러오기
    */


    loadPost();


  </script>


</body>

</html>
