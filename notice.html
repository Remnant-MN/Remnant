<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remnant 공지사항</title>


  <style>

    :root {

      --bg: #08080d;

      --panel: #11111a;

      --text: #f4f1ff;

      --muted: #a7a2b8;

      --accent: #a78bfa;

      --accent2: #6d28d9;

      --line: rgba(167,139,250,.22);

    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.6;

    }


    /* =========================
       상단 메뉴
    ========================= */

    header {

      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);

    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;

    }


    .logo span {

      color: var(--accent);

    }


    .home-button {

      padding: 10px 18px;

      border: 1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);

      transition: .2s;

    }


    .home-button:hover {

      background: var(--accent2);

    }


    /* =========================
       본문
    ========================= */

    main {

      max-width: 1000px;

      margin: auto;

      padding: 50px 24px;

    }


    .board-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 25px;

    }


    .board-header h1 {

      font-size: 2.2rem;

    }


    /* 글쓰기 버튼 */

    .write-button {

      display: inline-block;

      padding: 11px 18px;

      background: var(--accent2);

      color: white;

      text-decoration: none;

      border-radius: 999px;

      transition: .2s;

    }


    .write-button:hover {

      opacity: .85;

      transform: translateY(-2px);

    }


    /* =========================
       게시판
    ========================= */

    .board {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 16px;

      overflow: hidden;

    }


    .board-row {

      display: grid;

      grid-template-columns: 80px 1fr 140px;

      align-items: center;

      min-height: 62px;

      border-bottom: 1px solid var(--line);

    }


    .board-row:last-child {

      border-bottom: none;

    }


    .board-row > div {

      padding: 15px 20px;

    }


    /* 게시판 제목 */

    .board-head {

      color: var(--muted);

      font-size: .9rem;

      font-weight: bold;

      background: rgba(167,139,250,.06);

    }


    /* 번호 */

    .post-number {

      text-align: center;

      color: var(--muted);

      font-size: .9rem;

    }


    /* 제목 */

    .post-title {

      color: var(--text);

      text-decoration: none;

      font-weight: bold;

      word-break: break-word;

    }


    .post-title:hover {

      color: var(--accent);

    }


    /* 날짜 */

    .post-date {

      color: var(--muted);

      font-size: .9rem;

      text-align: center;

    }


    /* 마우스 효과 */

    .post-row:hover {

      background: rgba(167,139,250,.06);

    }


    /* 비어있을 때 */

    .empty {

      padding: 60px 20px;

      text-align: center;

      color: var(--muted);

    }


    /* 오류 */

    .error {

      padding: 60px 20px;

      text-align: center;

      color: #ff8a8a;

    }


    /* =========================
       하단
    ========================= */

    footer {

      border-top: 1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);

      margin-top: 50px;

    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 760px) {


      main {

        padding: 35px 15px;

      }


      .board-header {

        flex-direction: column;

        align-items: flex-start;

        gap: 18px;

      }


      .board-header h1 {

        font-size: 1.8rem;

      }


      .write-button {

        width: 100%;

        text-align: center;

      }


      .board-row {

        grid-template-columns: 50px 1fr 95px;

      }


      .board-row > div {

        padding: 13px 8px;

      }


      .post-date {

        font-size: .75rem;

      }


      .post-number {

        font-size: .8rem;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       상단 메뉴
  ========================= -->

  <header>

    <nav>


      <div class="logo">

        <span>Remnant</span>

      </div>


      <a

        href="index.html"

        class="home-button"

      >

        메인 화면으로 돌아가기

      </a>


    </nav>

  </header>


  <!-- =========================
       게시판
  ========================= -->

  <main>


    <div class="board-header">


      <h1>

        공지사항

      </h1>


      <a

        href="write.html"

        class="write-button"

      >


      </a>


    </div>


    <div

      id="board"

      class="board"

    >


      <!-- 게시글이 여기에 표시됨 -->

      <div class="empty">

        게시글을 불러오는 중입니다...

      </div>


    </div>


  </main>


  <!-- =========================
       하단
  ========================= -->

  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


  <!-- =========================
       Supabase
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    /* Supabase 설정 */

    const SUPABASE_URL =

      "https://isqkccngkadomhsackpf.supabase.co";


    const SUPABASE_KEY =

      "여기에_현재_사용중인_Supabase_Key";


    const supabaseClient =

      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

      );


    const board =

      document.getElementById(

        "board"

      );


    /* 게시글 불러오기 */

    async function loadPosts() {


      const {

        data,

        error

      } = await supabaseClient


        .from("posts")


        .select("*")


        .order(

          "created_at",

          {

            ascending: false

          }

        );


      /* 오류 */

      if (error) {


        console.error(

          error

        );


        board.innerHTML = `

          <div class="error">

            게시글을 불러오지 못했습니다.

          </div>

        `;


        return;

      }


      /* 게시글 없음 */

      if (!data || data.length === 0) {


        board.innerHTML = `

          <div class="empty">

            등록된 공지사항이 없습니다.

          </div>

        `;


        return;

      }


      /* 게시판 제목 */

      board.innerHTML = `

        <div class="board-row board-head">

          <div class="post-number">

            번호

          </div>

          <div>

            제목

          </div>

          <div class="post-date">

            작성일

          </div>

        </div>

      `;


      /* 게시글 표시 */

      data.forEach(

        function(post, index) {


          const row =

            document.createElement(

              "div"

            );


          row.className =

            "board-row post-row";


          row.innerHTML = `

            <div class="post-number">

              ${data.length - index}

            </div>


            <div>

              <a

                href="post.html?id=${post.id}"

                class="post-title"

              >

                ${post.title}

              </a>

            </div>


            <div class="post-date">

              ${new Date(

                post.created_at

              ).toLocaleDateString(

                "ko-KR"

              )}

            </div>

          `;


          board.appendChild(row);


        }

      );


    }


    /* 실행 */

    loadPosts();


  </script>


</body>

</html>
