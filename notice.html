<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Remnant 공지사항</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #21133c 0,
          var(--bg) 35%
        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.6;
    }


    /* 상단 메뉴 */

    header {

      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);
    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;
    }


    .logo span {

      color: var(--accent);
    }


    nav a {

      color: var(--muted);

      text-decoration: none;
    }


    nav a:hover {

      color: var(--text);
    }


    /* 본문 */

    main {

      max-width: 900px;

      margin: auto;

      padding: 40px 24px;
    }


    .notice-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 25px;

      gap: 20px;
    }


    .notice-header h1 {

      font-size: 2.2rem;
    }


    /* 글쓰기 버튼 */

    .write-button {

      display: inline-block;

      padding: 12px 20px;

      background: var(--accent2);

      color: white;

      text-decoration: none;

      border-radius: 999px;

      transition: .2s;
    }


    .write-button:hover {

      transform: translateY(-2px);

      opacity: .85;
    }


    /* 공지 목록 */

    .notice-list {

      display: flex;

      flex-direction: column;

      gap: 15px;
    }


    .notice-item {

      display: block;

      padding: 22px 25px;

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 15px;

      color: var(--text);

      text-decoration: none;

      transition: .2s;
    }


    .notice-item:hover {

      transform: translateY(-3px);

      border-color: var(--accent);
    }


    .notice-title {

      font-size: 1.2rem;

      font-weight: bold;

      margin-bottom: 6px;
    }


    .notice-date {

      color: var(--accent);

      font-size: .85rem;
    }


    .empty {

      padding: 40px;

      text-align: center;

      color: var(--muted);
    }


    /* 하단 */

    footer {

      border-top: 1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);

      margin-top: 50px;
    }


    /* 모바일 */

    @media (max-width: 760px) {

      .notice-header {

        flex-direction: column;

        align-items: flex-start;
      }


      .notice-header h1 {

        font-size: 1.8rem;
      }


      .write-button {

        width: 100%;

        text-align: center;
      }

    }

  </style>

</head>


<body>


  <!-- 상단 메뉴 -->

  <header>

    <nav>

      <div class="logo">

        <span>Remnant</span>

      </div>


      <a href="index.html">

        홈

      </a>

    </nav>

  </header>


  <!-- 본문 -->

  <main>


    <div class="notice-header">

      <h1>

        공지사항

      </h1>


      <!-- 글쓰기 버튼 -->

      <a

        href="write.html"

        class="write-button"

      >

        ✏️ 글쓰기

      </a>

    </div>


    <!-- 게시글 목록 -->

    <div

      id="noticeList"

      class="notice-list"

    >

    </div>


  </main>


  <!-- 하단 -->

  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


  <script>


    const noticeList =

      document.getElementById("noticeList");


    /*

      기본 공지사항

      처음 사이트에 들어왔을 때

      표시되는 기본 글

    */

    const defaultPosts = [

      {

        id: "world",

        title: "Remnant 세계관 설정",

        date: "2026",

        link: "world.html"

      },

      {

        id: "notice",

        title: "Remnant 공지",

        date: "2026",

        link: "notice-1.html"

      }

    ];


    /*

      localStorage에 저장된 글 가져오기

    */

    const savedPosts =

      JSON.parse(

        localStorage.getItem("posts")

      ) || [];


    /*

      기본 글 + 새로 작성한 글

    */

    const allPosts = [

      ...savedPosts,

      ...defaultPosts

    ];


    if (allPosts.length === 0) {


      noticeList.innerHTML = `

        <div class="empty">

          등록된 공지사항이 없습니다.

        </div>

      `;


    } else {


      allPosts.forEach(function(post) {


        const item = document.createElement("a");


        item.className = "notice-item";


        item.href = post.link || "#";


        item.innerHTML = `

          <div class="notice-title">

            ${post.title}

          </div>


          <div class="notice-date">

            ${post.date}

          </div>

        `;


        noticeList.appendChild(item);


      });

    }


  </script>


</body>

</html>
