<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Remnant 공지사항 |Remnant</title>

  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(
          circle at top right,
          #21133c 0,
          var(--bg) 35%
        );
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }


    header {
      background: rgba(8,8,13,.9);
      border-bottom: 1px solid var(--line);
    }


    nav {
      max-width: 1180px;
      margin: auto;
      padding: 18px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .logo {
      font-weight: 900;
      letter-spacing: .14em;
    }


    .logo span {
      color: var(--accent);
    }


    nav a {
      color: var(--muted);
      text-decoration: none;
    }


    nav a:hover {
      color: var(--text);
    }


    main {
      max-width: 1000px;
      margin: auto;
      padding: 80px 24px;
    }


    .page-title {
      font-size: 3rem;
      margin-bottom: 10px;
    }


    .subtitle {
      color: var(--muted);
      margin-bottom: 40px;
    }


    /* 게시판 */

    .board {
      width: 100%;
      border-top: 2px solid var(--accent);
      border-bottom: 1px solid var(--line);
    }


    .board-header,
    .board-row {
      display: grid;
      grid-template-columns: 80px 1fr 150px;
      align-items: center;
    }


    .board-header {
      padding: 16px 20px;
      background: var(--panel);
      color: var(--muted);
      font-weight: bold;
      border-bottom: 1px solid var(--line);
    }


    .board-row {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      transition: .2s;
    }


    .board-row:hover {
      background: rgba(167,139,250,.08);
    }


    .number {
      color: var(--muted);
      text-align: center;
    }


    .title a {
      color: var(--text);
      text-decoration: none;
      font-weight: bold;
    }


    .title a:hover {
      color: var(--accent);
    }


    .date {
      color: var(--muted);
      text-align: center;
      font-size: .9rem;
    }


    .back-button {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 20px;

      border: 1px solid var(--line);
      border-radius: 999px;

      color: var(--text);
      text-decoration: none;
      background: var(--panel);
    }


    .back-button:hover {
      background: var(--accent2);
    }


    footer {
      border-top: 1px solid var(--line);
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }


    @media (max-width: 760px) {

      .page-title {
        font-size: 2.2rem;
      }


      .board-header,
      .board-row {
        grid-template-columns: 50px 1fr 100px;
      }


      .board-header,
      .board-row {
        padding: 15px 10px;
      }


      .date {
        font-size: .75rem;
      }

    }

  </style>

</head>


<body>


  <header>

    <nav>

      <div class="logo">

      <span>Remnant</span>

      </div>


      <a href="index.html">

        홈으로 돌아가기

      </a>

    </nav>

  </header>


  <main>


    <h1 class="page-title">

      공지사항

    </h1>


    <p class="subtitle">

   Remnant 공지사항 홈페이지입니다.

    </p>


    <div class="board">


      <!-- 게시판 제목 -->

      <div class="board-header">

        <div class="number">

          번호

        </div>


        <div class="title">

          제목

        </div>


        <div class="date">

          날짜

        </div>

      </div>


      <!-- 게시글 3 -->

      <div class="board-row">

        <div class="number">

          미작성

        </div>


        <div class="title">

          <a href="notice-3.html">

            미작성

          </a>

        </div>


        <div class="date">

          2026.07.25

        </div>

      </div>


      <!-- 게시글 2 -->

      <div class="board-row">

        <div class="number">

          2

        </div>


        <div class="title">

          <a href="notice-2.html">

         Remnant 세계관 설정

          </a>

        </div>


        <div class="date">

          2026.07.25

        </div>

      </div>


      <!-- 게시글 1 -->

      <div class="board-row">

        <div class="number">

          1

        </div>


        <div class="title">

          <a href="notice-1.html">

            필독! Remnant 공지

          </a>

        </div>


        <div class="date">

         2026.07.25

        </div>

      </div>


    </div>


    <a
      href="index.html"
      class="back-button"
    >

      ← 메인으로 돌아가기

    </a>


  </main>


  <footer>

    © 2026 Remnant.
    All rights reserved.

  </footer>


</body>

</html>
