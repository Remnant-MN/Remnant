<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Remnant 공지사항</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, "Noto Sans KR", sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #21133c 0,
          var(--bg) 35%
        );

      color: var(--text);

      line-height: 1.6;

      min-height: 100vh;
    }


    /* 상단 메뉴 */

    header {
      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);
    }


    nav {
      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .logo {
      font-weight: 900;

      letter-spacing: .14em;
    }


    .logo span {
      color: var(--accent);
    }


    nav a {
      color: var(--muted);

      text-decoration: none;
    }


    nav a:hover {
      color: var(--text);
    }


    /* 본문 */

    main {
      max-width: 1000px;

      margin: auto;

      padding: 40px 24px 60px;
    }


    .page-title {
      font-size: 2.2rem;

      margin-bottom: 10px;
    }


    .page-subtitle {
      color: var(--muted);

      margin-bottom: 25px;
    }


    /* 글쓰기 버튼 */

    .notice-top {
      display: flex;

      justify-content: flex-end;

      margin-bottom: 20px;
    }


    .write-button {
      display: inline-block;

      padding: 12px 20px;

      border-radius: 999px;

      background: var(--accent2);

      color: var(--text);

      text-decoration: none;

      border: 1px solid var(--line);

      transition: .2s;
    }


    .write-button:hover {
      background: var(--accent);

      transform: translateY(-2px);
    }


    /* 공지사항 목록 */

    .notice-list {
      display: flex;

      flex-direction: column;

      gap: 15px;
    }


    .notice-item {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      padding: 22px 25px;

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 16px;

      text-decoration: none;

      color: var(--text);

      transition: .2s;
    }


    .notice-item:hover {
      transform: translateY(-3px);

      border-color: var(--accent);

      background: #171722;
    }


    .notice-title {
      font-size: 1.1rem;

      font-weight: bold;
    }


    .notice-date {
      color: var(--muted);

      font-size: .9rem;

      white-space: nowrap;
    }


    /* 홈으로 돌아가기 */

    .back-button {
      display: inline-block;

      margin-top: 30px;

      padding: 12px 20px;

      border: 1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);

      transition: .2s;
    }


    .back-button:hover {
      background: var(--accent2);
    }


    /* 하단 */

    footer {
      border-top: 1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);
    }


    /* 모바일 */

    @media (max-width: 760px) {

      nav {
        padding: 18px 20px;
      }


      main {
        padding: 30px 20px 50px;
      }


      .page-title {
        font-size: 1.8rem;
      }


      .notice-item {
        flex-direction: column;

        align-items: flex-start;

        gap: 5px;
      }


      .notice-date {
        font-size: .8rem;
      }

    }

  </style>

</head>


<body>


  <!-- 상단 메뉴 -->

  <header>

    <nav>

      <div class="logo">

        <span>Remnant</span>

      </div>


      <a href="index.html">

        홈으로

      </a>

    </nav>

  </header>


  <!-- 본문 -->

  <main>


    <h1 class="page-title">

      공지사항

    </h1>


    <p class="page-subtitle">

      Remnant의 공지사항을 확인하세요.

    </p>


    <!-- 글쓰기 버튼 -->

    <div class="notice-top">

      <a href="write.html" class="write-button">

        ✏️ 공지 글쓰기

      </a>

    </div>


    <!-- 공지사항 목록 -->

    <div class="notice-list">


      <a href="notice-1.html" class="notice-item">

        <span class="notice-title">

          Remnant 공지

        </span>


        <span class="notice-date">

          2026

        </span>

      </a>


      <a href="world.html" class="notice-item">

        <span class="notice-title">

          Remnant 세계관 설정

        </span>


        <span class="notice-date">

          2026

        </span>

      </a>


    </div>


    <!-- 홈으로 돌아가기 -->

    <a href="index.html" class="back-button">

      ← 메인 홈페이지로 돌아가기

    </a>


  </main>


  <!-- 하단 -->

  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


</body>

</html>
