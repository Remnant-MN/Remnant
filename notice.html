<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remnant 공지사항</title>


  <style>

    :root {

      --bg: #7A858B;

      --bg-dark: #59636A;

      --panel: #8D989E;

      --text: #F4F6F7;

      --muted: #D5DADD;

      --accent: #D9E0E3;

      --accent-dark: #4F5A61;

      --line: rgba(255,255,255,.28);

    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    body {

      font-family:

        Arial,

        "Noto Sans KR",

        sans-serif;


      background:

        linear-gradient(

          135deg,

          var(--bg-dark),

          var(--bg) 45%,

          #9DA7AC

        );


      color: var(--text);

      min-height: 100vh;

      line-height: 1.6;

    }


    /* 상단 */

    header {

      background:

        rgba(60,70,76,.85);


      border-bottom:

        1px solid var(--line);

    }


    nav {

      max-width: 1000px;

      margin: auto;


      padding: 20px 24px;


      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;

    }


    .logo span {

      color: var(--accent);

    }


    .home-button {

      display: inline-block;


      padding: 10px 18px;


      border:

        1px solid var(--line);


      border-radius: 999px;


      color: var(--text);

      text-decoration: none;


      background:

        rgba(60,70,76,.55);


      transition: .2s;

    }


    .home-button:hover {

      background: var(--accent-dark);

      transform: translateY(-2px);

    }


    /* 본문 */

    main {

      max-width: 900px;

      margin: auto;


      padding: 50px 24px;

    }


    .notice-header {

      display: flex;


      justify-content:

        space-between;


      align-items: center;


      margin-bottom: 25px;


      gap: 20px;

    }


    .notice-header h1 {

      font-size: 2.2rem;

    }


    .notice-list {

      display: flex;

      flex-direction: column;

      gap: 15px;

    }


    .notice-item {

      display: block;


      padding: 22px 25px;


      background:

        rgba(255,255,255,.13);


      border:

        1px solid var(--line);


      border-radius: 15px;


      color: var(--text);

      text-decoration: none;


      transition: .2s;

    }


    .notice-item:hover {

      transform: translateY(-3px);

      border-color: white;


      background:

        rgba(255,255,255,.2);

    }


    .notice-title {

      font-size: 1.2rem;

      font-weight: bold;

      margin-bottom: 6px;

    }


    .notice-date {

      color: var(--accent);

      font-size: .85rem;

    }


    /* 공지사항 */

    .notice-quick-link {

      margin-top: 30px;

    }


    .quick-button {

      display: inline-block;


      padding: 12px 20px;


      border:

        1px solid var(--line);


      border-radius: 999px;


      color: var(--text);


      text-decoration: none;


      background:

        rgba(60,70,76,.55);


      transition: .2s;

    }


    .quick-button:hover {

      background: var(--accent-dark);

      transform: translateY(-2px);

    }


    /* 하단 */

    footer {

      border-top:

        1px solid var(--line);


      text-align: center;


      padding: 30px;


      color: var(--muted);


      margin-top: 50px;

    }


    @media (max-width: 760px) {


      .notice-header {

        flex-direction: column;

        align-items: flex-start;

      }


      .notice-header h1 {

        font-size: 1.8rem;

      }


      .home-button {

        width: 100%;

        text-align: center;

      }


      main {

        padding: 35px 20px;

      }

    }

  </style>

</head>


<body>


  <!-- 상단 메뉴 -->

  <header>


    <nav>


      <div class="logo">


        <span>

          Remnant

        </span>


      </div>


      <a

        href="index.html"

        class="home-button"

      >

        ← 메인 화면으로 돌아가기

      </a>


    </nav>


  </header>


  <!-- 본문 -->

  <main>


    <div class="notice-header">


      <h1>

        공지사항

      </h1>


    </div>


    <div class="notice-list">


      <!-- 공지사항 1 -->

      <a

        href="notice-1.html"

        class="notice-item"

      >


        <div class="notice-title">

          Remnant 세계관 설정

        </div>


        <div class="notice-date">

          2026.07.28

        </div>


      </a>


      <!-- 공지사항 2 -->

      <a

        href="notice-2.html"

        class="notice-item"

      >


        <div class="notice-title">

          Remnant 활동 안내

        </div>


        <div class="notice-date">

          2026.07.28

        </div>


      </a>


    </div>


  </main>


  <!-- 하단 -->

  <footer>


    © 2026 Remnant.

    All rights reserved.


  </footer>


</body>

</html>
