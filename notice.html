<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remnant 공지사항</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.6;

    }


    header {

      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);

    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;

    }


    .logo span {

      color: var(--accent);

    }


    nav a {

      color: var(--muted);

      text-decoration: none;

    }


    nav a:hover {

      color: var(--text);

    }


    main {

      max-width: 900px;

      margin: auto;

      padding: 50px 24px;

    }


    .notice-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 25px;

      gap: 20px;

    }


    .notice-header h1 {

      font-size: 2.2rem;

    }


    .notice-list {

      display: flex;

      flex-direction: column;

      gap: 15px;

    }


    .notice-item {

      display: block;

      padding: 22px 25px;

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 15px;

      color: var(--text);

      text-decoration: none;

      transition: .2s;

    }


    .notice-item:hover {

      transform: translateY(-3px);

      border-color: var(--accent);

    }


    .notice-title {

      font-size: 1.2rem;

      font-weight: bold;

      margin-bottom: 6px;

    }


    .notice-date {

      color: var(--accent);

      font-size: .85rem;

    }


    .empty {

      padding: 40px;

      text-align: center;

      color: var(--muted);

    }


    footer {

      border-top: 1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);

      margin-top: 50px;

    }


    @media (max-width: 760px) {

      .notice-header {

        flex-direction: column;

        align-items: flex-start;

      }


      .notice-header h1 {

        font-size: 1.8rem;

      }

    }

  </style>

</head>


<body>


  <header>

    <nav>

      <div class="logo">

        <span>Remnant</span>

      </div>


      <a href="index.html">

        홈

      </a>

    </nav>

  </header>


  <main>


    <div class="notice-header">

      <h1>

        공지사항

      </h1>

    </div>


    <div

      id="noticeList"

      class="notice-list"

    >

      <div class="empty">

        게시글을 불러오는 중입니다...

      </div>

    </div>


  </main>


  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    const SUPABASE_URL =

      "https://isqkccngkadomhsackpf.supabase.co";


    const SUPABASE_KEY =

      "여기에_네가_사용하는_정상적인_Supabase_Key";


    const supabaseClient =

      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

      );


    const noticeList =

      document.getElementById(

        "noticeList"

      );


    /*

      기존에 직접 만든 고정 공지사항

    */

    const fixedPosts = [


      {

        title: "Remnant 공지",

        date: "2026년",

        link: "notice-1.html"

      },


      {

        title: "Remnant 세계관 설정",

        date: "2026년",

        link: "notice-2.html"

      }


    ];


    function createNoticeItem(

      title,

      date,

      link

    ) {


      const item =

        document.createElement("a");


      item.className =

        "notice-item";


      item.href = link;


      const titleElement =

        document.createElement("div");


      titleElement.className =

        "notice-title";


      titleElement.textContent =

        title;


      const dateElement =

        document.createElement("div");


      dateElement.className =

        "notice-date";


      dateElement.textContent =

        date;


      item.appendChild(

        titleElement

      );


      item.appendChild(

        dateElement

      );


      return item;

    }


    async function loadPosts() {


      noticeList.innerHTML = "";


      /*

        1. 기존 고정 공지 표시

      */


      fixedPosts.forEach(function(post) {


        const item =

          createNoticeItem(

            post.title,

            post.date,

            post.link

          );


        noticeList.appendChild(item);

      });


      /*

        2. Supabase 게시글 불러오기

      */


      const {

        data,

        error

      } = await supabaseClient

        .from("posts")

        .select("*")

        .order(

          "created_at",

          {

            ascending: false

          }

        );


      if (error) {


        console.error(

          "Supabase 오류:",

          error

        );


        return;

      }


      if (!data) {

        return;

      }


      data.forEach(function(post) {


        const date =

          new Date(

            post.created_at

          ).toLocaleDateString(

            "ko-KR"

          );


        const item =

          createNoticeItem(

            post.title,

            date,

            `post.html?id=${post.id}`

          );


        noticeList.appendChild(item);

      });

    }


    loadPosts();


  </script>


</body>

</html>
