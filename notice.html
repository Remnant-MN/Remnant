<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remnant 공지사항</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.6;
    }


    header {

      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);
    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;
    }


    .logo span {

      color: var(--accent);
    }


    nav a {

      color: var(--muted);

      text-decoration: none;
    }


    nav a:hover {

      color: var(--text);
    }


    main {

      max-width: 900px;

      margin: auto;

      padding: 50px 24px;
    }


    .notice-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 25px;

      gap: 20px;
    }


    .notice-header h1 {

      font-size: 2.2rem;
    }


    .write-button {

      display: inline-block;

      padding: 12px 20px;

      background: var(--accent2);

      color: white;

      text-decoration: none;

      border-radius: 999px;

      transition: .2s;
    }


    .write-button:hover {

      transform: translateY(-2px);

      opacity: .85;
    }


    .notice-list {

      display: flex;

      flex-direction: column;

      gap: 15px;
    }


    .notice-item {

      display: block;

      padding: 22px 25px;

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 15px;

      color: var(--text);

      text-decoration: none;

      transition: .2s;
    }


    .notice-item:hover {

      transform: translateY(-3px);

      border-color: var(--accent);
    }


    .notice-title {

      font-size: 1.2rem;

      font-weight: bold;

      margin-bottom: 6px;
    }


    .notice-date {

      color: var(--accent);

      font-size: .85rem;
    }


    .empty {

      padding: 40px;

      text-align: center;

      color: var(--muted);
    }


    .error {

      padding: 30px;

      text-align: center;

      color: #ff8a8a;
    }


    footer {

      border-top: 1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);

      margin-top: 50px;
    }


    @media (max-width: 760px) {

      .notice-header {

        flex-direction: column;

        align-items: flex-start;
      }


      .notice-header h1 {

        font-size: 1.8rem;
      }


      .write-button {

        width: 100%;

        text-align: center;
      }

    }

  </style>

</head>


<body>


  <header>

    <nav>

      <div class="logo">

        <span>Remnant</span>

      </div>


      <a href="index.html">

        홈

      </a>

    </nav>

  </header>


  <main>


    <div class="notice-header">

      <h1>

        공지사항

      </h1>


      <a
        href="write.html"
        class="write-button"
      >

        ✏️ 글쓰기

      </a>

    </div>


    <div
      id="noticeList"
      class="notice-list"
    >

      <div class="empty">

        게시글을 불러오는 중입니다...

      </div>

    </div>


  </main>


  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    const SUPABASE_URL =
      "https://isqkccngkadomhsackpf.supabase.co";


    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzcWtjY25na2Fkb21oc2Fja3BmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDgxNDksImV4cCI6MjEwMDYyNDE0OX0.zaEy5ua3Zvd4IULk8byqC5ASjvNZ_0mH3jpynrmzzyM";


    const supabaseClient =
      window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

      );


    const noticeList =
      document.getElementById(
        "noticeList"
      );


    async function loadPosts() {


      const {

        data,

        error

      } = await supabaseClient

        .from("posts")

        .select("*")

        .order(

          "created_at",

          {

            ascending: false

          }

        );


      if (error) {

        console.error(error);


        noticeList.innerHTML = `

          <div class="error">

            게시글을 불러오지 못했습니다.

            <br><br>

            오류:

            ${error.message}

          </div>

        `;

        return;

      }


      if (!data || data.length === 0) {

        noticeList.innerHTML = `

          <div class="empty">

            등록된 공지사항이 없습니다.

          </div>

        `;

        return;

      }


      noticeList.innerHTML = "";


      data.forEach(function(post) {


        const item =
          document.createElement("a");


        item.className =
          "notice-item";


        item.href =
          `post.html?id=${post.id}`;


        const title =
          document.createElement("div");


        title.className =
          "notice-title";


        title.textContent =
          post.title;


        const date =
          document.createElement("div");


        date.className =
          "notice-date";


        date.textContent =

          new Date(

            post.created_at

          ).toLocaleDateString(

            "ko-KR"

          );


        item.appendChild(title);


        item.appendChild(date);


        noticeList.appendChild(item);

      });

    }


    loadPosts();


  </script>


</body>

</html>
