<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remnant 공지사항</title>


  <style>

    :root {

      --bg: #08080d;

      --panel: #11111a;

      --text: #f4f1ff;

      --muted: #a7a2b8;

      --accent: #a78bfa;

      --accent2: #6d28d9;

      --line: rgba(167,139,250,.22);

    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.6;

    }


    /* 상단 메뉴 */

    header {

      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);

    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;

    }


    .logo span {

      color: var(--accent);

    }


    /* 메인 버튼 */

    .home-button {

      display: inline-block;

      padding: 10px 18px;

      border: 1px solid var(--line);

      border-radius: 999px;

      color: var(--text);

      text-decoration: none;

      background: var(--panel);

      transition: .2s;

    }


    .home-button:hover {

      background: var(--accent2);

      transform: translateY(-2px);

    }


    /* 본문 */

    main {

      max-width: 900px;

      margin: auto;

      padding: 50px 24px;

    }


    .notice-header {

      margin-bottom: 30px;

    }


    .notice-header h1 {

      font-size: 2.2rem;

    }


    /* 공지사항 목록 */

    .notice-list {

      display: flex;

      flex-direction: column;

      gap: 15px;

    }


    .notice-item {

      display: block;

      padding: 24px 25px;

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 15px;

      color: var(--text);

      text-decoration: none;

      transition: .2s;

    }


    .notice-item:hover {

      transform: translateY(-3px);

      border-color: var(--accent);

      background: #171522;

    }


    .notice-title {

      font-size: 1.2rem;

      font-weight: bold;

      margin-bottom: 6px;

    }


    .notice-date {

      color: var(--accent);

      font-size: .85rem;

    }


    /* 하단 */

    footer {

      border-top: 1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);

      margin-top: 50px;

    }


    /* 모바일 */

    @media (max-width: 760px) {


      nav {

        padding: 18px 20px;

      }


      main {

        padding: 35px 20px;

      }


      .notice-header h1 {

        font-size: 1.8rem;

      }


      .home-button {

        padding: 9px 14px;

        font-size: .9rem;

      }

    }

  </style>

</head>


<body>


  <!-- 상단 메뉴 -->

  <header>

    <nav>


      <div class="logo">

        <span>Remnant</span>

      </div>


      <!-- 메인 화면 버튼 -->

      <a

        href="index.html"

        class="home-button"

      >

        메인 화면

      </a>


    </nav>

  </header>


  <!-- 본문 -->

  <main>


    <div class="notice-header">

      <h1>

        공지사항

      </h1>

    </div>


    <!-- 공지사항 목록 -->

    <div class="notice-list">


      <!-- 첫 번째 공지 -->

      <a

        href="notice-1.html"

        class="notice-item"

      >


        <div class="notice-title">

          Remnant 공지

        </div>


        <div class="notice-date">

          2026

        </div>


      </a>


      <!-- 두 번째 공지 -->

      <a

        href="notice-2.html"

        class="notice-item"

      >


        <div class="notice-title">

          Remnant 세계관 설정

        </div>


        <div class="notice-date">

          2026

        </div>


      </a>


    </div>


  </main>


  <!-- 하단 -->

  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


</body>

</html>
