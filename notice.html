<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Remnant 공지사항</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
      --danger: #dc2626;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #21133c 0,
          var(--bg) 35%
        );

      color: var(--text);

      min-height: 100vh;

      line-height: 1.6;
    }


    header {

      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);
    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;
    }


    .logo span {

      color: var(--accent);
    }


    nav a {

      color: var(--muted);

      text-decoration: none;
    }


    nav a:hover {

      color: var(--text);
    }


    main {

      max-width: 900px;

      margin: auto;

      padding: 40px 24px;
    }


    .notice-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 25px;

      gap: 20px;
    }


    .notice-header h1 {

      font-size: 2.2rem;
    }


    .write-button {

      display: inline-block;

      padding: 12px 20px;

      background: var(--accent2);

      color: white;

      text-decoration: none;

      border-radius: 999px;

      transition: .2s;
    }


    .write-button:hover {

      transform: translateY(-2px);

      opacity: .85;
    }


    .notice-list {

      display: flex;

      flex-direction: column;

      gap: 15px;
    }


    .notice-item {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      padding: 22px 25px;

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 15px;

      transition: .2s;
    }


    .notice-item:hover {

      border-color: var(--accent);
    }


    .notice-link {

      flex: 1;

      color: var(--text);

      text-decoration: none;
    }


    .notice-title {

      font-size: 1.2rem;

      font-weight: bold;

      margin-bottom: 6px;
    }


    .notice-date {

      color: var(--accent);

      font-size: .85rem;
    }


    /* 삭제 버튼 */

    .delete-button {

      padding: 8px 14px;

      border: none;

      border-radius: 8px;

      background: var(--danger);

      color: white;

      cursor: pointer;

      font-size: .85rem;

      transition: .2s;
    }


    .delete-button:hover {

      opacity: .8;

      transform: translateY(-2px);
    }


    .empty {

      padding: 40px;

      text-align: center;

      color: var(--muted);
    }


    footer {

      border-top: 1px solid var(--line);

      text-align: center;

      padding: 30px;

      color: var(--muted);

      margin-top: 50px;
    }


    @media (max-width: 760px) {

      .notice-header {

        flex-direction: column;

        align-items: flex-start;
      }


      .notice-header h1 {

        font-size: 1.8rem;
      }


      .write-button {

        width: 100%;

        text-align: center;
      }


      .notice-item {

        align-items: flex-start;

        flex-direction: column;
      }


      .delete-button {

        width: 100%;
      }

    }

  </style>

</head>


<body>


  <header>

    <nav>

      <div class="logo">

        <span>Remnant</span>

      </div>


      <a href="index.html">

        홈

      </a>

    </nav>

  </header>


  <main>


    <div class="notice-header">

      <h1>

        공지사항

      </h1>


      <a
        href="write.html"
        class="write-button"
      >

        ✏️ 글쓰기

      </a>

    </div>


    <div
      id="noticeList"
      class="notice-list"
    >

    </div>


  </main>


  <footer>

    © 2026 Remnant.

    All rights reserved.

  </footer>


  <!-- Supabase 라이브러리 -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    /* =========================

       Supabase 연결

    ========================= */


    const SUPABASE_URL =
      "YOUR_SUPABASE_URL";


    const SUPABASE_ANON_KEY =
      "YOUR_SUPABASE_ANON_KEY";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const noticeList =
      document.getElementById("noticeList");


    /* =========================

       기본 게시글

       삭제 버튼 없음

    ========================= */


    const defaultPosts = [

      {

        id: "world",

        title: "Remnant 세계관 설정",

        date: "2026",

        link: "world.html"

      },


      {

        id: "notice",

        title: "Remnant 공지",

        date: "2026",

        link: "notice-1.html"

      }

    ];


    /* =========================

       게시글 불러오기

    ========================= */


    async function loadPosts() {


      noticeList.innerHTML = "";


      const {

        data,

        error

      } = await supabaseClient

        .from("posts")

        .select("*")

        .order(

          "created_at",

          {

            ascending: false

          }

        );


      if (error) {


        console.error(error);


        noticeList.innerHTML = `

          <div class="empty">

            게시글을 불러오지 못했습니다.

          </div>

        `;


        return;

      }


      const savedPosts = data || [];


      const allPosts = [

        ...savedPosts,

        ...defaultPosts

      ];


      if (allPosts.length === 0) {


        noticeList.innerHTML = `

          <div class="empty">

            등록된 공지사항이 없습니다.

          </div>

        `;


        return;

      }


      allPosts.forEach(function(post) {


        const item =
          document.createElement("div");


        item.className =
          "notice-item";


        const link =
          document.createElement("a");


        link.className =
          "notice-link";


        link.href =
          post.link || `post.html?id=${post.id}`;


        link.innerHTML = `

          <div class="notice-title">

            ${post.title}

          </div>


          <div class="notice-date">

            ${post.created_at
              ? new Date(post.created_at)
                .toLocaleDateString("ko-KR")
              : post.date}

          </div>

        `;


        item.appendChild(link);


        /*

          Supabase 글만 삭제 버튼 표시

        */

        if (post.id) {


          const deleteButton =
            document.createElement("button");


          deleteButton.className =
            "delete-button";


          deleteButton.textContent =
            "삭제";


          deleteButton.addEventListener(

            "click",

            function(event) {


              event.preventDefault();


              event.stopPropagation();


              deletePost(post.id);


            }

          );


          item.appendChild(deleteButton);

        }


        noticeList.appendChild(item);


      });

    }


    /* =========================

       게시글 삭제

    ========================= */


    async function deletePost(id) {


      const confirmed =

        confirm(

          "정말 이 게시글을 삭제할까요?"

        );


      if (!confirmed) {

        return;

      }


      const {

        error

      } = await supabaseClient

        .from("posts")

        .delete()

        .eq("id", id);


      if (error) {


        console.error(error);


        alert(

          "게시글 삭제에 실패했습니다."

        );


        return;

      }


      alert(

        "게시글이 삭제되었습니다."

      );


      loadPosts();

    }


    /* =========================

       실행

    ========================= */


    loadPosts();


  </script>


</body>

</html>
