<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN - REM NANT</title>
    <style>
        :root {
            --bg-color: #7A858B;
            --bg-dark: #1a1a1a;
            --text-main: #EAEAEA;
            --text-sub: #BAC3C7;
            --accent-color: #00FFCC;
            --card-bg: rgba(0, 0, 0, 0.8);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }

        /* 배경 글리치/노이즈 효과 레이어 */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.5) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.08), rgba(0, 255, 0, 0.04), rgba(0, 0, 255, 0.08));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .login-box {
            background: var(--card-bg);
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-box h2 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent-color);
            color: var(--bg-dark);
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.3s;
            margin-top: 1rem;
        }

        .login-btn:hover {
            opacity: 0.85;
        }

        /* 회원가입 버튼 디자인 추가 */
        .register-btn {
            width: 100%;
            padding: 0.9rem;
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 0.8rem;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .register-btn:hover {
            background: var(--accent-color);
            color: var(--bg-dark);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--accent-color);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-box">
        <h2>SYSTEM LOGIN</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="name">Agent ID</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Access Code</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-btn">ACCESS</button>
        </form>

        <!-- 회원가입 페이지로 이동하는 버튼 (register.html을 만들어서 연결하거나 추후 서버 가입창 주소 입력) -->
        <a href="register.html" class="register-btn">REGISTER (회원가입)</a>

        <a href="index.html" class="back-link">&lt; HOME으로 돌아가기</a>
    </div>

</body>
</html>
