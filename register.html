<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTER - REM NANT</title>
    <style>
        :root {
            --bg-color: #7A858B;
            --bg-dark: #1a1a1a;
            --text-main: #EAEAEA;
            --text-sub: #BAC3C7;
            --accent-color: #00FFCC;
            --card-bg: rgba(0, 0, 0, 0.8);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem 0; }

        /* 배경 글리치/노이즈 효과 레이어 */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.5) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.08), rgba(0, 255, 0, 0.04), rgba(0, 0, 255, 0.08));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .register-box {
            background: var(--card-bg);
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .register-box h2 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent-color);
            color: var(--bg-dark);
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.3s;
            margin-top: 1.5rem;
        }

        .submit-btn:hover {
            opacity: 0.85;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--accent-color);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="register-box">
        <h2>AGENT REGISTRATION</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="Nickname">Agent ID (아이디)</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="email">Email (이메일)</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Access Code (비밀번호)</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
                <label for="password-check">Confirm Access Code (비밀번호 확인)</label>
                <input type="password" id="password-check" name="password-check" required>
            </div>
            <button type="submit" class="submit-btn">REGISTER</button>
        </form>
        <a href="index.html" class="back-link">&lt; 메인으로 돌아가기</a>
    </div>

</body>
</html>
