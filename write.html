<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>공지사항 작성</title>


  <style>

    :root {
      --bg: #08080d;
      --panel: #11111a;
      --text: #f4f1ff;
      --muted: #a7a2b8;
      --accent: #a78bfa;
      --accent2: #6d28d9;
      --line: rgba(167,139,250,.22);
    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }


    body {

      font-family: Arial, "Noto Sans KR", sans-serif;

      background:

        radial-gradient(

          circle at top right,

          #21133c 0,

          var(--bg) 35%

        );

      color: var(--text);

      min-height: 100vh;
    }


    /* 상단 */

    header {

      background: rgba(8,8,13,.9);

      border-bottom: 1px solid var(--line);
    }


    nav {

      max-width: 1000px;

      margin: auto;

      padding: 20px 24px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .logo {

      font-weight: 900;

      letter-spacing: .14em;
    }


    .logo span {

      color: var(--accent);
    }


    nav a {

      color: var(--muted);

      text-decoration: none;
    }


    /* 본문 */

    main {

      max-width: 900px;

      margin: auto;

      padding: 40px 24px;
    }


    .write-box {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: 20px;

      padding: 35px;
    }


    h1 {

      margin-bottom: 30px;
    }


    label {

      display: block;

      margin-bottom: 8px;

      font-weight: bold;
    }


    input,

    textarea {

      width: 100%;

      padding: 14px;

      margin-bottom: 22px;

      background: #08080d;

      color: var(--text);

      border: 1px solid var(--line);

      border-radius: 10px;

      font-size: 1rem;
    }


    textarea {

      min-height: 350px;

      resize: vertical;

      line-height: 1.7;
    }


    input:focus,

    textarea:focus {

      outline: none;

      border-color: var(--accent);
    }


    /* 버튼 */

    .button-area {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }


    button,

    .cancel-button {

      padding: 13px 22px;

      border-radius: 999px;

      font-size: 1rem;

      cursor: pointer;

      text-decoration: none;
    }


    button {

      border: none;

      background: var(--accent2);

      color: white;
    }


    button:hover {

      opacity: .8;
    }


    .cancel-button {

      border: 1px solid var(--line);

      color: var(--text);

      background: var(--panel);
    }


    .cancel-button:hover {

      background: var(--accent2);
    }


    /* 모바일 */

    @media (max-width: 760px) {

      .write-box {

        padding: 25px 20px;
      }

    }

  </style>

</head>


<body>


  <!-- 상단 메뉴 -->

  <header>

    <nav>

      <div class="logo">

        <span>Remnant</span>

      </div>


      <a href="notice.html">

        공지사항

      </a>

    </nav>

  </header>


  <!-- 글쓰기 -->

  <main>

    <div class="write-box">

      <h1>

        공지사항 작성

      </h1>


      <form id="writeForm">


        <label for="title">

          제목

        </label>


        <input

          type="text"

          id="title"

          placeholder="공지사항 제목을 입력하세요"

          required

        >


        <label for="content">

          내용

        </label>


        <textarea

          id="content"

          placeholder="공지사항 내용을 입력하세요"

          required

        ></textarea>


        <div class="button-area">


          <button type="submit">

            게시하기

          </button>


          <a

            href="notice.html"

            class="cancel-button"

          >

            취소

          </a>


        </div>


      </form>

    </div>

  </main>


  <script>


    const form =

      document.getElementById("writeForm");


    form.addEventListener(

      "submit",

      function(event) {


        event.preventDefault();


        const title =

          document

          .getElementById("title")

          .value;


        const content =

          document

          .getElementById("content")

          .value;


        const date =

          new Date()

          .toLocaleDateString("ko-KR");


        const newPost = {


          id: Date.now(),

          title: title,

          content: content,

          date: date

        };


        const posts =

          JSON.parse(

            localStorage.getItem("posts")

          ) || [];


        posts.unshift(newPost);


        localStorage.setItem(

          "posts",

          JSON.stringify(posts)

        );


        alert("공지사항이 등록되었습니다.");


        location.href = "notice.html";


      }

    );


  </script>


</body>

</html>
